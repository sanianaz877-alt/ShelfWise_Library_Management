<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c3b"><meta name="description" content="ShelfWise Library Management System"><title>Reports | ShelfWise</title><link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/reports.js"></script><script>window.downloadCSV=(name,rows)=>{const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}</script></head><body><div id="app"></div></body></html>
